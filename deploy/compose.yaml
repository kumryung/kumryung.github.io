services:
  web:
    image: nginx:1.28-alpine
    container_name: ryanfamily-site
    restart: unless-stopped
    user: "101:101"
    read_only: true
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "127.0.0.1:4330:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./releases:/srv/www:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
