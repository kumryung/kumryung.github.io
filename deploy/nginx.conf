worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    server {
        listen 8080;
        server_name www.ryanfamily.xyz;
        root /srv/www/current;
        index index.html;
        charset utf-8;
        if ($http_x_forwarded_proto = http) { return 308 https://www.ryanfamily.xyz$request_uri; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        add_header Cache-Control "no-cache" always;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location ~ /\. { deny all; }
        location / { try_files $uri $uri/ =404; }
    }
}
